
[ServerSettings]
host = 127.0.0.1
port = 3800
; Whether to use HTTPS for server URLs, keep disabled if you are not sure. (default: false)
use_https = false

[Debugging]
; Available levels: debug, info, warning, error, critical
; Keep this at INFO on any server players can reach. DEBUG is very noisy and
; third-party libraries can log request bodies at that level. Use DEBUG locally
; while working on something, not in production.
logging_level = INFO

[AdminUsers]
admin_ids = 1

[Webhooks]
; Discord webhook for debug purposes throughout the code
error_webhook =
registration_webhook = 