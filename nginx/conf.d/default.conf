# Plain HTTP. Works out of the box with no domain and no certificates.
#
# Enable TLS by copying ../tls.conf.example to ./tls.conf (see the certbot
# section in docker-compose.yml). Once tls.conf exists it handles your domain on
# :443 and redirects :80 -> :443 for that domain, while this block keeps serving
# the ACME challenge so renewals work.

upstream privaterama {
    server privaterama:3800;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # trackFlashError payloads can be chunky.
    client_max_body_size 10M;

    # Let's Encrypt ACME challenge.
    #
    # This MUST stay above any redirect. The previous config put
    # `return 301 https://...` at the server level, which nginx evaluates in the
    # rewrite phase before location matching - that made every request on :80
    # redirect, including this challenge path, so a certificate could never be
    # issued (and plain HTTP was dead too, because no certificate existed yet).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    # Game assets (SWF, sounds, images) straight off disk.
    # Trailing slashes on both sides are required for alias to resolve correctly.
    location /assets/ {
        alias /srv/assets/;
        expires 14d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # The app mounts its stylesheets under this exact prefix, so nginx has to
    # mirror it (see the StaticFiles mount for "/templates/styles" in server.py).
    location /templates/styles/ {
        alias /srv/styles/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass http://privaterama;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
