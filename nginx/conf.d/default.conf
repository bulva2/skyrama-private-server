server {
    listen 80;
    server_name xxx;  # Replace with your domain

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment after getting certs)
    return 301 https://$host$request_uri;

    # Serve assets directly
    location /assets/ {
        alias /app/assets/;
        expires 14d;
        add_header Cache-Control "public, no-transform";
    }

    # Serve styles directly
    location /templates/styles/ {
        alias /app/templates/styles/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy everything else to FastAPI
    location / {
        proxy_pass http://privaterama:3800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name xxx;  # Replace with your domain

    client_max_body_size 10M;
    client_body_buffer_size 100M;

    ssl_certificate /etc/letsencrypt/live/xxx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xxx/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location /assets/ {
        alias /app/assets/;
        expires 14d;
        add_header Cache-Control "public, no-transform";
    }

    location /templates/styles/ {
        alias /app/templates/styles/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://privaterama:3800;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
