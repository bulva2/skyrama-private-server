# docker compose up -d --build

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-skyrama}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyrama}
  POSTGRES_DB: ${POSTGRES_DB:-skyrama}

services:
  db:
    image: postgres:18-alpine
    container_name: skyrama-db
    logging: *default-logging
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    ports:
      # Published so you can connect with psql / pgAdmin / DBeaver.
      #
      # Host port defaults to 5433, NOT 5432, because a natively installed
      # PostgreSQL usually already owns 5432 - publishing to it would make
      # `compose up` fail with "port is already allocated", or worse, silently
      # have you pointing your client at the wrong database.
      #
      # DB_BIND defaults to 127.0.0.1: the database is reachable from the host
      # itself only. On a server, keep it that way and reach it over an SSH
      # tunnel:  ssh -L 5433:127.0.0.1:5433 user@your-server
      #
      # Setting DB_BIND=0.0.0.0 puts Postgres on the public internet. Be aware
      # that Docker inserts its own iptables rules ahead of ufw/firewalld, so a
      # `ufw deny 5433` will NOT protect a published port - the firewall is
      # bypassed. Only do this with a strong POSTGRES_PASSWORD and a provider
      # level firewall / security group restricting the source IP.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skyrama} -d ${POSTGRES_DB:-skyrama} -q" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  privaterama:
    build: .
    image: skyrama-private-server:local
    container_name: privaterama
    logging: *default-logging
    restart: unless-stopped
    environment:
      # Host is the compose service name `db`, NOT localhost - inside a
      # container localhost is the container itself.
      DB_CONNECTION_STRING: >-
        ${DB_URL:-postgresql+psycopg://${POSTGRES_USER:-skyrama}:${POSTGRES_PASSWORD:-skyrama}@db:5432/${POSTGRES_DB:-skyrama}}
      # Signs the session cookie. Change it for anything public: with the
      # default value anyone can forge a login session.
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-session-secret}
      # Absolute origin the Flash client uses for /SkyApi.php and the login
      # form. Derived from DOMAIN so there is only one thing to set:
      #   no DOMAIN    -> http://localhost
      #   DOMAIN=x.com -> https://x.com   (Caddy always serves a real host over TLS)
      # Set PUBLIC_URL explicitly only to override, e.g. a LAN IP.
      PUBLIC_URL: ${PUBLIC_URL:-http${DOMAIN:+s}://${DOMAIN:-localhost}}
    volumes:
      # Read-only bind mounts instead of COPY: keeps the image small and lets
      # you edit game data / config and just restart the container.
      - ./assets:/app/assets:ro
      - ./data:/app/data:ro
      - ./templates:/app/templates:ro
      - ./stub:/app/stub:ro
      - ./config.cfg:/app/config.cfg:ro
    expose:
      - "3800"
    # Uncomment to reach the app directly, bypassing Caddy (handy for debugging).
    # ports:
    #   - "127.0.0.1:3800:3800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: skyrama-caddy
    logging: *default-logging
    restart: unless-stopped
    environment:
      # This is the entire TLS setup.
      #   DOMAIN unset      -> ":80", plain HTTP, no certificates involved
      #   DOMAIN=x.com      -> Caddy gets a certificate on first request and
      #                        renews it forever, and redirects :80 to :443
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./assets:/srv/assets:ro
      - ./templates/styles:/srv/styles:ro
      # Certificates and account keys live here - this volume MUST persist, or
      # every restart re-requests certificates and will hit rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      privaterama:
        condition: service_started
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    container_name: skyrama-grafana
    logging: *default-logging
    restart: unless-stopped
    profiles: [ "production" ]
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_storage:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - app-network

  loki:
    image: grafana/loki:3
    container_name: skyrama-loki
    logging: *default-logging
    restart: unless-stopped
    profiles: [ "production" ]
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -log.level=warn
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - app-network

  alloy:
    image: grafana/alloy:latest
    container_name: skyrama-alloy
    logging: *default-logging
    restart: unless-stopped
    profiles: [ "production" ]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  loki_data:
  grafana_storage:
  alloy_data:
