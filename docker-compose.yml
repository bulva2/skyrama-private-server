# Skyrama Private Server - full stack.
#
#   docker compose up -d --build
#   -> game on http://localhost
#
# Everything has a working default, so a fresh clone with no .env at all still
# boots. Copy .env-example to .env only when you want to change credentials,
# the public URL, or point at an external database.
#
# TLS is opt-in and documented at the bottom of this file.

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-skyrama}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyrama}
  POSTGRES_DB: ${POSTGRES_DB:-skyrama}

services:
  db:
    image: postgres:17-alpine
    container_name: skyrama-db
    restart: unless-stopped
    environment: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published so you can connect with psql / pgAdmin / DBeaver.
      #
      # Host port defaults to 5433, NOT 5432, because a natively installed
      # PostgreSQL usually already owns 5432 - publishing to it would make
      # `compose up` fail with "port is already allocated", or worse, silently
      # have you pointing your client at the wrong database.
      #
      # DB_BIND defaults to 127.0.0.1: the database is reachable from the host
      # itself only. On a server, keep it that way and reach it over an SSH
      # tunnel:  ssh -L 5433:127.0.0.1:5433 user@your-server
      #
      # Setting DB_BIND=0.0.0.0 puts Postgres on the public internet. Be aware
      # that Docker inserts its own iptables rules ahead of ufw/firewalld, so a
      # `ufw deny 5433` will NOT protect a published port - the firewall is
      # bypassed. Only do this with a strong POSTGRES_PASSWORD and a provider
      # level firewall / security group restricting the source IP.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5433}:5432"
    healthcheck:
      # The app's first action is CREATE TABLE, so it must not start before
      # Postgres actually accepts connections for the right user/database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skyrama} -d ${POSTGRES_DB:-skyrama} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-network

  privaterama:
    build: .
    image: skyrama-private-server:local
    container_name: privaterama
    restart: unless-stopped
    environment:
      # Host is the compose service name `db`, NOT localhost - inside a
      # container localhost is the container itself.
      DB_CONNECTION_STRING: >-
        ${DB_URL:-postgresql+psycopg://${POSTGRES_USER:-skyrama}:${POSTGRES_PASSWORD:-skyrama}@db:5432/${POSTGRES_DB:-skyrama}}
      # Signs the session cookie. Change it for anything public: with the
      # default value anyone can forge a login session.
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-session-secret}
      # Absolute origin the Flash client uses for /SkyApi.php and the login
      # form. Must be reachable from the player's browser, so it has to be the
      # public address of nginx - not the internal container port.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      # Read-only bind mounts instead of COPY: keeps the image small and lets
      # you edit game data / config and just restart the container.
      - ./assets:/app/assets:ro
      - ./data:/app/data:ro
      - ./templates:/app/templates:ro
      - ./stub:/app/stub:ro
      - ./config.cfg:/app/config.cfg:ro
    expose:
      - "3800"
    # Uncomment to reach the app directly, bypassing nginx (handy for debugging).
    # ports:
    #   - "127.0.0.1:3800:3800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Only the two directories nginx actually serves are mounted - the old
      # setup mounted the whole repo (including .env and .git) into nginx.
      - ./assets:/srv/assets:ro
      - ./templates/styles:/srv/styles:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      privaterama:
        condition: service_started
    networks:
      - app-network

  # TLS is opt-in - it never runs (and never fails) during a normal `up`.
  #
  #   1. Point your domain's A record at this host.
  #   2. Put DOMAIN=example.com and CERTBOT_EMAIL=you@example.com in .env,
  #      and set PUBLIC_URL=https://example.com.
  #   3. docker compose up -d                      # HTTP must be reachable first
  #   4. docker compose --profile tls run --rm certbot
  #   5. cp nginx/tls.conf.example nginx/conf.d/tls.conf
  #      and replace REPLACE_WITH_YOUR_DOMAIN in it with your domain.
  #   6. docker compose restart nginx
  #
  # Renewal: docker compose --profile tls run --rm certbot renew
  # (add that to a host cron job; it does not need to run continuously).
  certbot:
    image: certbot/certbot
    container_name: certbot
    profiles: ["tls"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      # Set CERTBOT_STAGING=0 once you have confirmed the flow works. Staging
      # certs are not trusted by browsers but do not burn Let's Encrypt rate
      # limits, so the first run uses them by default.
      CERTBOT_STAGING: ${CERTBOT_STAGING:-1}
    # Validated here rather than with compose's ${VAR:?...} syntax, because that
    # is interpolated when the file is parsed and would break `docker compose up`
    # for everyone who never enables TLS.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        [ -n "$${DOMAIN}" ] || { echo "ERROR: set DOMAIN in .env first" >&2; exit 1; }
        [ -n "$${CERTBOT_EMAIL}" ] || { echo "ERROR: set CERTBOT_EMAIL in .env first" >&2; exit 1; }
        [ "$${CERTBOT_STAGING}" = "1" ] && STAGING=--staging || STAGING=
        exec certbot "$$@" $${STAGING} \
          --webroot -w /var/www/certbot \
          -d "$${DOMAIN}" --email "$${CERTBOT_EMAIL}" \
          --agree-tos --no-eff-email --non-interactive
      - certbot
    command: ["certonly"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  certbot-etc:
  certbot-webroot:
